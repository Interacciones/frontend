version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Node version $(node -v)"
        - echo "NPM version $(npm -v)"
        - npm ci
    build:
      commands:
        - echo "Starting build process"
        - NEXT_DISABLE_ESLINT=1 npm run deployable || true
        - echo "Build completed, attempting export"
        - npm run export || echo "Export not needed"
        - ls -la
        - ls -la out || echo "out directory not found"
        - mkdir -p out
        - find .next/static -type d -name "chunks" -o -name "media" | xargs -I{} cp -R {} out/ || echo "No static assets to copy"
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable' 